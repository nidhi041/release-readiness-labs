name: Release Pipeline

on:
  push:
    branches:
      - main
      - investigation/release-readiness

jobs:
  validate-release:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Tests
        run: |
          echo "Running validation tests for OrderFlow v2.3.0..."
          npm install --prefix app
          npm test --prefix app
          echo "Validation complete - all tests passed."

      - name: Verify Release Version
        run: |
          VERSION=$(node -e "const p=require('./app/package.json'); console.log(p.version)")
          echo "Validated release version: $VERSION"

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-release
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Production
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          AWS_SECRET: ${{ secrets.AWS_SECRET }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      - name: Tag Release
        run: |
          echo "Release v2.3.0 deployed successfully to production."
          echo "Image: lab-app:v2.3.0"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
